name: Tests

on: 
  pull_request:
  push:
    branches: [main] # code coverage reporting needs to be on main so all PRs can compare against it.

concurrency: # cancel previous workflow run if one exists.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: customerio/mobile-ci-tools/.github/workflows/ios-test.yml@main
    with:
      # GitHub's Xcode 27 runner image. Pinned with fastlane/Scanfile: the image's only installed
      # iOS simulator runtime is 27.0. Change one, check the other.
      runner-label: 'xcode-27'
      xcode-version: '27.0'
      # Recent passing runs took up to about 10 minutes; the limit stops a hung run from holding a Mac.
      timeout-minutes: 20
      scheme: 'CioFirebaseWrapper'
      xcresult-name: 'CioFirebaseWrapper.xcresult'
      # Must track the Ruby this repo's Gemfile.lock is resolved against; the lock pulls
      # excon 1.7, which needs >= 3.3, so the shared workflow's 3.2 default cannot install it.
      ruby-version: '3.4'
