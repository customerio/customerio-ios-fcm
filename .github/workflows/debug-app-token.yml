name: Debug App token

# Temporary probe to verify the cio-mobile-release App is wired up correctly before
# locking down main with a ruleset. Triggers only on its own file via the paths
# filter so it doesn't spam unrelated PRs. Delete this file once the run is green
# and the expected hash equalities below hold.

on:
  push:
    paths:
      - .github/workflows/debug-app-token.yml
  pull_request:
    paths:
      - .github/workflows/debug-app-token.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App installation token
        id: app_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - name: Print App identity
        run: |
          echo "App slug: ${{ steps.app_token.outputs.app-slug }}"
          echo "Installation ID: ${{ steps.app_token.outputs.installation-id }}"

      - name: Hash the App token
        env:
          T: ${{ steps.app_token.outputs.token }}
        run: |
          echo "app-token sha256: $(printf %s "$T" | shasum -a 256 | cut -d' ' -f1)"

      - name: Hash GITHUB_TOKEN
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_TOKEN sha256: $(printf %s "$T" | shasum -a 256 | cut -d' ' -f1)"

      - name: Checkout WITHOUT token override
        uses: actions/checkout@v4
        with:
          path: default-checkout

      - name: Hash credentials persisted by default checkout
        run: |
          cd default-checkout
          h=$(git config --get http.https://github.com/.extraheader | awk '{print $3}' | base64 -d | cut -d: -f2 | tr -d '\n' | shasum -a 256 | cut -d' ' -f1)
          echo "default-checkout persisted sha256: $h"

      - name: Checkout WITH App token
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}
          path: app-checkout

      - name: Hash credentials persisted by App-token checkout
        run: |
          cd app-checkout
          h=$(git config --get http.https://github.com/.extraheader | awk '{print $3}' | base64 -d | cut -d: -f2 | tr -d '\n' | shasum -a 256 | cut -d' ' -f1)
          echo "app-checkout persisted sha256: $h"
